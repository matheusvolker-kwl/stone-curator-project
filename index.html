<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/png" href="/favicon.png">
    <title>Western — Pedras artesanais para paisagismo profissional</title>
    <meta name="author" content="Western" />

    <!-- description, og:title/description/url/type e twitter:title/description
         são POR PÁGINA — emitidos pelo <Seo> (react-helmet-async). Duplicá-los
         aqui fazia toda página carregar DUAS descrições, e a estática (da home)
         vinha primeiro no DOM: era ela que os parsers liam. Só ficam os
         fallbacks de imagem, que o <Seo> herda de propósito quando a página
         não define os seus. -->
    <meta property="og:image" content="https://westernstore.com.br/og/og-default.jpg">
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://westernstore.com.br/og/og-default.jpg">

    <meta name="theme-color" content="#0F2818" />
    <meta name="color-scheme" content="light" />

    <!-- Performance: pré-conecta a CDNs críticos antes do parser pedir -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdn.shopify.com" crossorigin />
    <link rel="preconnect" href="https://checkout.westernstore.com.br" crossorigin />
    <link rel="preconnect" href="https://zibtysewpbeycngtbjjk.supabase.co" crossorigin />
    <link rel="dns-prefetch" href="https://cdn.shopify.com" />
    
    <!-- DS V3 (decisão do cliente, jul/2026): display = Archivo 650 (sans grotesca),
         corpo/UI = Source Sans 3. Sem serifa em uso no produto. -->
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Western",
        "url": "https://westernstore.com.br/",
        "logo": "https://westernstore.com.br/brand/logo-western.png",
        "description": "Fabricante artesanal de pedras decorativas para paisagismo profissional, em São Paulo.",
        "sameAs": ["https://instagram.com/westernpools"]
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Western",
        "url": "https://westernstore.com.br/"
      }
    </script>

    <!-- Microsoft Clarity — mapa de calor + gravações de sessão (instalado 11/08,
         lançamento). O id do projeto é público por natureza (vai no HTML). -->
    <script type="text/javascript">
      (function(c,l,a,r,i,t,y){
        c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
        t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
        y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
      })(window, document, "clarity", "script", "y0rtan89qm");
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
